# Scheduled Notion backup → Git history in a PRIVATE repository.
#
# Setup
#   1. Create a PRIVATE repository (the backup contains your workspace content) and copy this file to
#      `.github/workflows/vaultweave-backup.yml`.
#   2. Repository secrets:
#        VAULTWEAVE_TOKEN   (required)  Notion internal-integration token
#        VAULTWEAVE_ALERT   (optional)  a full alert target, e.g.  slack:https://hooks.slack.com/services/…
#                                  or  discord:https://discord.com/api/webhooks/…  or  webhook:https://…
#   3. Share the pages/databases you want backed up with the integration (••• → Connections).
#
# Failure handling — a failed backup is never silent:
#   - `vaultweave sync` exits non-zero when the backup is incomplete → this job fails → GitHub notifies you;
#   - if VAULTWEAVE_ALERT is set, vaultweave also alerts that channel (1st failure, then 2nd, 4th, 8th…) and
#     sends one "recovered" notice afterwards. The run history that drives this lives in the cached
#     state DB; without a cache hit every failure alerts (the safe direction).
#
# Pin the vaultweave version once you have tested it (`vaultweave@1.2.3` instead of `vaultweave@latest`).
name: vaultweave-backup

on:
  schedule:
    - cron: "17 2 * * *" # daily, off the top of the hour to avoid the queue
  workflow_dispatch:

permissions:
  contents: write # needed to push the backup commit

concurrency:
  group: vaultweave-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The repository is checked out INTO ./backup: that directory is the git repo vaultweave commits to.
      - uses: actions/checkout@v4
        with:
          path: backup

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # State DB (vaultweave.db): unchanged-page detection, deletion tombstones, run history for alerts.
      # It is gitignored by vaultweave, so it must travel through the cache instead. Saved even when the
      # sync fails (`if: always()` below) so the failure streak survives to the next run.
      - name: Restore vaultweave state
        uses: actions/cache/restore@v4
        with:
          path: |
            backup/vaultweave.db
            backup/vaultweave.db-wal
            backup/vaultweave.db-shm
          key: vaultweave-state-${{ github.run_id }}
          restore-keys: vaultweave-state-

      - name: Sync Notion workspace
        env:
          VAULTWEAVE_TOKEN: ${{ secrets.VAULTWEAVE_TOKEN }}
          VAULTWEAVE_ALERT: ${{ secrets.VAULTWEAVE_ALERT }}
        run: |
          args=(--out ./backup --git --quiet)
          if [ -n "$VAULTWEAVE_ALERT" ]; then args+=(--notify "$VAULTWEAVE_ALERT"); fi
          npx --yes vaultweave@latest sync "${args[@]}"

      - name: Save vaultweave state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            backup/vaultweave.db
            backup/vaultweave.db-wal
            backup/vaultweave.db-shm
          key: vaultweave-state-${{ github.run_id }}

      # Push whatever was committed, even after a partially failed sync: a partial backup is still
      # real history. Skipped only when the job was cancelled.
      - name: Push backup commit
        if: ${{ !cancelled() }}
        working-directory: backup
        run: git push
