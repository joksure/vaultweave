name: Bug report
description: Something is wrong or a backup is incomplete
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! First check [CAPABILITIES.md](https://github.com/joksure/vaultweave/blob/main/CAPABILITIES.md) — content marked ❌ is a
        Notion API limit rather than a bug.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs actual behaviour.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command and (redacted) config.
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`vaultweave doctor --json` output"
      description: Run `npx vaultweave doctor --json` and paste the result. It contains no token.
      render: json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "vaultweave --version"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Before submitting
      options:
        - label: I removed tokens and private workspace content from everything I pasted.
          required: true
