name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Does the official Notion API expose this?
      description: Link to the relevant endpoint if you know it. Unsupported content is stubbed, not silently dropped.
