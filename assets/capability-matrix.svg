<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="cap-title">
  <title id="cap-title">vaultweave capability matrix — what gets backed up</title>
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1e1a"/>
      <stop offset="1" stop-color="#0c1512"/>
    </linearGradient>
  </defs>

  <rect width="900" height="340" fill="url(#cbg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" fill="#e9f5f1" font-family="Arial, Helvetica, sans-serif"
        font-size="17" font-weight="700" text-anchor="middle" letter-spacing="2">CAPABILITY MATRIX</text>
  <text x="450" y="58" fill="#4a6b60" font-family="Arial, Helvetica, sans-serif"
        font-size="12" text-anchor="middle">What Notion lets us export, and what vaultweave actually exports today</text>

  <!-- Column headers -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1">
    <text x="30" y="88" fill="#6b9b8f">CONTENT</text>
    <text x="430" y="88" fill="#6b9b8f" text-anchor="middle">OFFICIAL API</text>
    <text x="610" y="88" fill="#6b9b8f" text-anchor="middle">INTERNAL API</text>
    <text x="790" y="88" fill="#6b9b8f" text-anchor="middle">STATUS</text>
  </g>
  <line x1="30" y1="96" x2="870" y2="96" stroke="#1c2f28" stroke-width="1"/>

  <!-- Rows -->
  <!-- Row data: [y, content, official, internal, status, status-color] -->

  <!-- Row 1 -->
  <g transform="translate(0, 104)" font-family="Arial, Helvetica, sans-serif" font-size="13">
    <rect x="14" y="4" width="872" height="32" rx="5" fill="#131f1c" opacity="0.6"/>
    <text x="30" y="24" fill="#c8ddd8">Pages &amp; nested blocks → Markdown</text>
    <text x="430" y="24" fill="#55d6be" text-anchor="middle">✅ official</text>
    <text x="610" y="24" fill="#55d6be" text-anchor="middle">✅ yes</text>
    <rect x="720" y="8" width="145" height="22" rx="11" fill="#1a3028"/>
    <text x="793" y="24" fill="#55d6be" text-anchor="middle" font-weight="700">✅ implemented</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(0, 140)" font-family="Arial, Helvetica, sans-serif" font-size="13">
    <text x="30" y="24" fill="#c8ddd8">Databases (schema + rows) → CSV / JSON</text>
    <text x="430" y="24" fill="#55d6be" text-anchor="middle">✅ rows + props</text>
    <text x="610" y="24" fill="#55d6be" text-anchor="middle">✅ yes</text>
    <rect x="720" y="8" width="145" height="22" rx="11" fill="#1a3028"/>
    <text x="793" y="24" fill="#55d6be" text-anchor="middle" font-weight="700">✅ implemented</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(0, 176)" font-family="Arial, Helvetica, sans-serif" font-size="13">
    <rect x="14" y="4" width="872" height="32" rx="5" fill="#131f1c" opacity="0.6"/>
    <text x="30" y="24" fill="#c8ddd8">Files / images / attachments</text>
    <text x="430" y="24" fill="#55d6be" text-anchor="middle">✅ re-hosted</text>
    <text x="610" y="24" fill="#55d6be" text-anchor="middle">✅ yes</text>
    <rect x="720" y="8" width="145" height="22" rx="11" fill="#1a3028"/>
    <text x="793" y="24" fill="#55d6be" text-anchor="middle" font-weight="700">✅ implemented</text>
  </g>

  <!-- Row 4 -->
  <g transform="translate(0, 212)" font-family="Arial, Helvetica, sans-serif" font-size="13">
    <text x="30" y="24" fill="#c8ddd8">Comments (page-level)</text>
    <text x="430" y="24" fill="#55d6be" text-anchor="middle">✅ page-level</text>
    <text x="610" y="24" fill="#55d6be" text-anchor="middle">✅ resolved</text>
    <rect x="720" y="8" width="145" height="22" rx="11" fill="#2a2a14"/>
    <text x="793" y="24" fill="#f0b45b" text-anchor="middle" font-weight="700">🚧 planned M2</text>
  </g>

  <!-- Row 5 -->
  <g transform="translate(0, 248)" font-family="Arial, Helvetica, sans-serif" font-size="13">
    <rect x="14" y="4" width="872" height="32" rx="5" fill="#131f1c" opacity="0.6"/>
    <text x="30" y="24" fill="#c8ddd8">Database views (table/board/calendar/…)</text>
    <text x="430" y="24" fill="#55d6be" text-anchor="middle">✅ definitions</text>
    <text x="610" y="24" fill="#55d6be" text-anchor="middle">✅ yes</text>
    <rect x="720" y="8" width="145" height="22" rx="11" fill="#1a2220"/>
    <text x="793" y="24" fill="#8fbfb4" text-anchor="middle" font-weight="700">🧪 experimental</text>
  </g>

  <!-- Row 6 -->
  <g transform="translate(0, 284)" font-family="Arial, Helvetica, sans-serif" font-size="13">
    <text x="30" y="24" fill="#6b9b8f">Automations / button configs</text>
    <text x="430" y="24" fill="#4a6b60" text-anchor="middle">❌ not exposed</text>
    <text x="610" y="24" fill="#6b9b8f" text-anchor="middle">◐ partial</text>
    <rect x="720" y="8" width="145" height="22" rx="11" fill="#1e1a14"/>
    <text x="793" y="24" fill="#7a6a40" text-anchor="middle" font-weight="700">⚠ stubbed</text>
  </g>

  <!-- Legend note -->
  <text x="30" y="326" fill="#2e4d45" font-family="Arial, Helvetica, sans-serif" font-size="11">
    Unsupported content is rendered as an explicit stub comment in output — silence is never mistaken for success.
  </text>
</svg>
