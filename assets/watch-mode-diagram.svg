<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="watch-title">
  <title id="watch-title">vaultweave watch mode and alert escalation diagram</title>
  <defs>
    <linearGradient id="watch-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1e1a"/>
      <stop offset="1" stop-color="#0c1512"/>
    </linearGradient>
    <marker id="wa" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#55d6be"/>
    </marker>
    <marker id="wa-amber" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f0b45b"/>
    </marker>
    <marker id="wa-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e07070"/>
    </marker>
  </defs>

  <rect width="900" height="280" fill="url(#watch-bg)" rx="12"/>

  <text x="450" y="36" fill="#e9f5f1" font-family="Arial, Helvetica, sans-serif"
        font-size="17" font-weight="700" text-anchor="middle" letter-spacing="2">WATCH MODE &amp; ALERTING</text>

  <!-- Timeline: run cycle -->
  <!-- Interval bar -->
  <rect x="30" y="76" width="840" height="8" rx="4" fill="#1c2f28"/>

  <!-- Tick marks and labels -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#4a6b60">
    <line x1="30" y1="68" x2="30" y2="92" stroke="#4a6b60" stroke-width="1.5"/>
    <text x="30" y="106" text-anchor="middle">t=0</text>

    <line x1="250" y1="68" x2="250" y2="92" stroke="#4a6b60" stroke-width="1.5"/>
    <text x="250" y="106" text-anchor="middle">+6h</text>

    <line x1="470" y1="68" x2="470" y2="92" stroke="#f0b45b" stroke-width="1.5"/>
    <text x="470" y="106" text-anchor="middle" fill="#f0b45b">+12h ✗</text>

    <line x1="550" y1="68" x2="550" y2="92" stroke="#f0b45b" stroke-width="1.5"/>
    <text x="550" y="106" text-anchor="middle" fill="#f0b45b">+5m</text>

    <line x1="640" y1="68" x2="640" y2="92" stroke="#f0b45b" stroke-width="1.5"/>
    <text x="640" y="106" text-anchor="middle" fill="#f0b45b">+10m</text>

    <line x1="750" y1="68" x2="750" y2="92" stroke="#55d6be" stroke-width="1.5"/>
    <text x="750" y="106" text-anchor="middle" fill="#55d6be">+18h ✔</text>

    <line x1="870" y1="68" x2="870" y2="92" stroke="#4a6b60" stroke-width="1.5"/>
    <text x="870" y="106" text-anchor="middle">+24h</text>
  </g>

  <!-- Success syncs (teal dots) -->
  <circle cx="30" cy="80" r="8" fill="#152720" stroke="#55d6be" stroke-width="2"/>
  <text x="30" y="84" fill="#55d6be" font-family="Arial" font-size="9" text-anchor="middle">✔</text>

  <circle cx="250" cy="80" r="8" fill="#152720" stroke="#55d6be" stroke-width="2"/>
  <text x="250" y="84" fill="#55d6be" font-family="Arial" font-size="9" text-anchor="middle">✔</text>

  <!-- Failure dot -->
  <circle cx="470" cy="80" r="10" fill="#2a1414" stroke="#e07070" stroke-width="2"/>
  <text x="470" y="85" fill="#e07070" font-family="Arial" font-size="10" text-anchor="middle">✗</text>

  <!-- Retry dots -->
  <circle cx="550" cy="80" r="7" fill="#231c10" stroke="#f0b45b" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="550" y="84" fill="#f0b45b" font-family="Arial" font-size="9" text-anchor="middle">↺</text>

  <circle cx="640" cy="80" r="7" fill="#231c10" stroke="#f0b45b" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="640" y="84" fill="#f0b45b" font-family="Arial" font-size="9" text-anchor="middle">↺</text>

  <!-- Recovery dot -->
  <circle cx="750" cy="80" r="8" fill="#152720" stroke="#55d6be" stroke-width="2"/>
  <text x="750" y="84" fill="#55d6be" font-family="Arial" font-size="9" text-anchor="middle">✔</text>

  <!-- Next sync -->
  <circle cx="870" cy="80" r="8" fill="#152720" stroke="#4a6b60" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Alert callouts -->
  <!-- Alert 1: 1st failure -->
  <line x1="470" y1="92" x2="470" y2="138" stroke="#e07070" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="380" y="138" width="180" height="50" rx="8" fill="#2a1414" stroke="#e07070" stroke-width="1.5"/>
  <text x="470" y="157" fill="#e07070" font-family="Arial, Helvetica, sans-serif"
        font-size="11" font-weight="700" text-anchor="middle">🔔 ALERT FIRED</text>
  <text x="470" y="174" fill="#8f7070" font-family="Arial, Helvetica, sans-serif"
        font-size="10" text-anchor="middle">1st consecutive failure</text>

  <!-- Retry label -->
  <text x="595" y="130" fill="#8f7f50" font-family="Arial, Helvetica, sans-serif"
        font-size="11" text-anchor="middle">early retry: 5m → 10m → 20m…</text>

  <!-- Recovery alert -->
  <line x1="750" y1="92" x2="750" y2="138" stroke="#55d6be" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="666" y="138" width="168" height="50" rx="8" fill="#152720" stroke="#55d6be" stroke-width="1.5"/>
  <text x="750" y="157" fill="#55d6be" font-family="Arial, Helvetica, sans-serif"
        font-size="11" font-weight="700" text-anchor="middle">✅ RECOVERED</text>
  <text x="750" y="174" fill="#4a7a6a" font-family="Arial, Helvetica, sans-serif"
        font-size="10" text-anchor="middle">one "recovered" notice</text>

  <!-- Feature list below -->
  <line x1="30" y1="208" x2="870" y2="208" stroke="#1c2f28" stroke-width="1"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b9b8f">
    <text x="30" y="232">
      <tspan fill="#55d6be">✔</tspan>  Never overlaps runs
    </text>
    <text x="200" y="232">
      <tspan fill="#55d6be">✔</tspan>  Escalation: 1st → 2nd → 4th → 8th…
    </text>
    <text x="510" y="232">
      <tspan fill="#55d6be">✔</tspan>  SIGINT / SIGTERM graceful stop
    </text>
    <text x="730" y="232">
      <tspan fill="#55d6be">✔</tspan>  Lock file, no overlap
    </text>

    <text x="30" y="256">
      <tspan fill="#55d6be">✔</tspan>  Targets: webhook · Slack · Discord
    </text>
    <text x="310" y="256">
      <tspan fill="#55d6be">✔</tspan>  Exit codes: 0 ok · 1 failed · 3 skipped (locked)
    </text>
    <text x="670" y="256">
      <tspan fill="#55d6be">✔</tspan>  Tokens scrubbed from alerts
    </text>
  </g>
</svg>
